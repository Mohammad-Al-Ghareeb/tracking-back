name: Keep backend alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping application health endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 2 \
            --max-time 30 \
            "${{ secrets.HEALTH_URL }}"
